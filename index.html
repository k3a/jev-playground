<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jev Playground</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #222633;
    --border: #2d3140;
    --text: #e1e4ed;
    --text2: #9ca3b4;
    --accent: #6c8aff;
    --accent2: #5b7af0;
    --green: #34d399;
    --red: #f87171;
    --yellow: #fbbf24;
    --orange: #fb923c;
    --radius: 10px;
    --radius-sm: 6px;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
    --transition: 0.15s ease;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
  }

  .app { max-width: 1100px; margin: 0 auto; padding: 32px 24px 80px; }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 36px;
  }
  .logo {
    font-size: 22px; font-weight: 700; letter-spacing: -0.5px;
    background: linear-gradient(135deg, var(--accent), #a78bfa);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .badge {
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
    background: var(--surface2); color: var(--text2); padding: 4px 10px; border-radius: 20px;
  }

  /* Cards */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 22px 24px; margin-bottom: 20px;
  }
  .card-header {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;
  }
  .card-title {
    font-size: 13px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.6px; color: var(--text2);
  }

  /* Form elements */
  label {
    display: block; font-size: 12px; font-weight: 500;
    color: var(--text2); margin-bottom: 5px; letter-spacing: 0.3px;
  }
  input, textarea, select {
    width: 100%; background: var(--surface2); border: 1px solid var(--border);
    border-radius: var(--radius-sm); color: var(--text); padding: 10px 14px;
    font-family: var(--font); font-size: 14px; resize: vertical;
    transition: border-color var(--transition);
  }
  input:focus, textarea:focus, select:focus {
    outline: none; border-color: var(--accent);
  }
  textarea { min-height: 90px; }
  input[type="text"] { font-family: var(--mono); font-size: 13px; }

  .uri-row { display: flex; gap: 10px; align-items: end; }
  .uri-row input { flex: 1; }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    font-family: var(--font); font-size: 13px; font-weight: 600;
    padding: 10px 18px; border-radius: var(--radius-sm); border: none;
    cursor: pointer; transition: all var(--transition);
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent2); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-outline {
    background: transparent; border: 1px solid var(--border); color: var(--text);
  }
  .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
  .btn-sm { font-size: 11px; padding: 5px 10px; }
  .btn-danger { background: transparent; border: 1px solid transparent; color: var(--red); }
  .btn-danger:hover { border-color: var(--red); }
  .btn-icon {
    display: inline-flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; padding: 0; border-radius: var(--radius-sm);
    background: var(--surface2); border: 1px solid var(--border); color: var(--text2);
    cursor: pointer; transition: all var(--transition);
  }
  .btn-icon:hover { border-color: var(--accent); color: var(--accent); }
  .btn-icon.copied { border-color: var(--green); color: var(--green); }

  /* Questions */
  .question-item {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 16px 18px; margin-bottom: 12px;
  }
  .question-header {
    display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap;
  }
  .question-header input { width: 140px; }
  .question-header select { width: 120px; }
  .q-field-row { display: flex; gap: 10px; margin-bottom: 8px; align-items: start; }
  .q-field-row:last-child { margin-bottom: 0; }
  .q-field-row > * { flex: 1; }

  /* Criteria (key-value pairs) */
  .criteria-list { display: flex; flex-direction: column; gap: 6px; }
  .criteria-row { display: flex; gap: 8px; align-items: center; }
  .criteria-row input { flex: 1; }
  .criteria-row .btn-icon { width: 26px; height: 26px; font-size: 14px; }

  /* CURL box */
  .curl-box {
    position: relative; background: #0d0f15; border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 14px 44px 14px 16px;
    font-family: var(--mono); font-size: 12px; line-height: 1.6;
    color: #c9d1d9; overflow-x: auto; white-space: pre-wrap; word-break: break-all;
    max-height: 120px; overflow-y: auto;
  }
  .curl-box .copy-btn {
    position: absolute; top: 8px; right: 8px;
  }

     /* Response */
  .response-meta {
    display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 16px;
    font-size: 13px;
  }
  .meta-chip {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 20px; padding: 5px 14px; font-size: 12px;
  }
  .meta-chip span { color: var(--text2); margin-right: 4px; }
  .meta-chip strong { color: var(--text); }

  /* Answer cards */
  .answers-grid { display: grid; gap: 14px; }
  .answer-card {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 16px 18px;
  }
  .answer-type {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.6px;
    color: var(--accent); font-weight: 600; margin-bottom: 6px;
  }
  .answer-name {
    font-size: 15px; font-weight: 600; margin-bottom: 10px;
  }
  .answer-value {
    font-size: 28px; font-weight: 700; letter-spacing: -1px; margin-bottom: 6px;
  }
  .answer-value.choice { color: var(--green); }
  .answer-value.noul-true { color: var(--orange); }
  .answer-value.noul-false { color: var(--text2); }
  .answer-value.score { color: var(--accent); }
  .answer-confidence {
    font-size: 12px; color: var(--text2);
  }
  .prob-bars { margin-top: 10px; display: flex; flex-direction: column; gap: 4px; }
  .prob-row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .prob-label { width: 90px; text-align: right; color: var(--text2); flex-shrink: 0; }
  .prob-bar-track { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .prob-bar-fill { height: 100%; border-radius: 3px; background: var(--accent); transition: width 0.4s ease; }
  .prob-pct { width: 44px; text-align: right; font-family: var(--mono); font-size: 11px; color: var(--text2); }

  /* Error */
  .error-box {
    background: #3b1018; border: 1px solid #6b1c2a; color: #fca5a5;
    border-radius: var(--radius-sm); padding: 14px 18px; font-size: 13px;
    font-family: var(--mono); white-space: pre-wrap;
  }

  .empty-state {
    text-align: center; padding: 40px 20px; color: var(--text2); font-size: 14px;
  }

  .add-question-row { display: flex; gap: 10px; align-items: end; }
  .add-question-row input { width: 140px; }
  .add-question-row select { width: 130px; }

  hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }

  /* Animations */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    width: 16px; height: 16px; border: 2px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.6s linear infinite; display: inline-block;
  }

  .flex-between { display: flex; justify-content: space-between; align-items: center; }
  .gap-sm { gap: 8px; }
  .gap-md { gap: 14px; }
  .mt-sm { margin-top: 8px; }
  .mt-md { margin-top: 16px; }
</style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <div class="header">
    <span class="logo">◆ Jev Playground</span>
    <span class="badge">API tester</span>
  </div>

  <!-- API Endpoint -->
  <div class="card">
    <div class="card-header"><span class="card-title">API Endpoint</span></div>
    <div class="uri-row">
      <input type="text" id="apiUri" value="http://localhost:8000/v1/systemone" placeholder="API URI">
      <input type="text" id="model" value="jev-latest" placeholder="Model" style="width:160px;flex:none;">
    </div>
  </div>

  <!-- State -->
  <div class="card">
    <div class="card-header"><span class="card-title">State</span></div>
    <textarea id="state" placeholder="Enter the state text...">Hi, this is the third time I am writing. Our payouts have failed every day since Monday and my team cannot pay suppliers. I already re-entered the bank details twice. If this is not fixed today we will have to move to another provider.</textarea>
  </div>

  <!-- Questions -->
  <div class="card">
    <div class="card-header">
      <span class="card-title">Questions</span>
      <button class="btn btn-outline btn-sm" onclick="addQuestion()">+ Add Question</button>
    </div>
    <div id="questionsContainer"></div>
  </div>

  <!-- CURL -->
  <div class="card">
    <div class="card-header">
      <span class="card-title">Generated cURL</span>
      <button class="btn btn-outline btn-sm" id="copyCurlBtn" onclick="copyCurl()">📋 Copy</button>
    </div>
    <div class="curl-box" id="curlBox"></div>
  </div>

  <!-- Actions -->
  <div style="display:flex;gap:12px;margin-bottom:20px;">
    <button class="btn btn-primary" id="sendBtn" onclick="sendRequest()">
      ▶ Send Request
    </button>
    <span id="timing" style="display:none;align-items:center;gap:8px;font-size:13px;color:var(--text2);">
      <span class="spinner" id="spinner"></span>
      <span id="timingText"></span>
    </span>
  </div>

  <!-- Response -->
  <div id="responseArea">
    <div class="empty-state">Send a request to see the response here.</div>
  </div>

</div>

<script>
// ---- State ----
let questions = [
  {
    name: 'team',
    type: 'choice',
    instructions: 'Which team should handle this ticket?',
    criteria: { billing: 'Payments, payouts, invoices and refunds', technical: 'Bugs, outages, integrations and API errors', sales: 'Pricing, upgrades and new accounts', account: 'Login, profile and permissions' }
  },
  { name: 'urgent', type: 'noul', instructions: 'Does the customer need a response today?' },
  {
    name: 'frustration',
    type: 'score',
    instructions: 'How frustrated is the customer?',
    criteria: ['Calm', 'Mildly annoyed', 'Frustrated', 'Angry and ready to churn']
  },
  { name: 'churn_risk', type: 'noul', instructions: 'Does the customer threaten to leave or switch providers?' }
];

// ---- Render ----
function renderQuestions() {
  const container = document.getElementById('questionsContainer');
  container.innerHTML = questions.map((q, i) => {
    const typeOptions = ['choice','noul','score'].map(t =>
      `<option value="${t}" ${q.type===t?'selected':''}>${t}</option>`
    ).join('');

    let extraFields = '';
    if (q.type === 'choice') {
      const entries = Object.entries(q.criteria || {});
      extraFields = `
        <div class="criteria-list" style="margin-top:10px;">
          <label style="margin-bottom:4px;">Criteria (key → description)</label>
          ${entries.map(([k,v], ci) => `
            <div class="criteria-row">
              <input type="text" value="${esc(k)}" placeholder="key" onchange="updateChoiceKey(${i},${ci},this.value)" style="width:120px;flex:none;">
              <input type="text" value="${esc(v)}" placeholder="description" onchange="updateChoiceVal(${i},${ci},this.value)">
              <button class="btn-icon" onclick="removeChoiceKey(${i},${ci})" title="Remove">×</button>
            </div>
          `).join('')}
          <button class="btn btn-outline btn-sm" style="align-self:start;margin-top:4px;" onclick="addChoiceKey(${i})">+ Key</button>
        </div>`;
    } else if (q.type === 'score') {
      const arr = q.criteria || [];
      extraFields = `
        <div class="criteria-list" style="margin-top:10px;">
          <label style="margin-bottom:4px;">Score Labels (0..N)</label>
          ${arr.map((v, si) => `
            <div class="criteria-row">
              <span style="font-size:11px;color:var(--text2);width:20px;">${si}</span>
              <input type="text" value="${esc(v)}" placeholder="Label ${si}" onchange="updateScoreLabel(${i},${si},this.value)">
              <button class="btn-icon" onclick="removeScoreLabel(${i},${si})" title="Remove">×</button>
            </div>
          `).join('')}
          <button class="btn btn-outline btn-sm" style="align-self:start;margin-top:4px;" onclick="addScoreLabel(${i})">+ Label</button>
        </div>`;
    }

    return `
      <div class="question-item">
        <div class="question-header">
          <input type="text" value="${esc(q.name)}" placeholder="Key name" onchange="updateQuestion(${i},'name',this.value)">
          <select onchange="updateQuestionType(${i},this.value)">${typeOptions}</select>
          <button class="btn btn-danger btn-sm" onclick="removeQuestion(${i})">🗑 Remove</button>
        </div>
        <div>
          <label>Instructions</label>
          <input type="text" value="${esc(q.instructions||'')}" placeholder="Question instructions..." onchange="updateQuestion(${i},'instructions',this.value)">
        </div>
        ${extraFields}
      </div>`;
  }).join('');

  updateCurl();
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function updateQuestion(i, key, value) {
  questions[i][key] = value;
  if (key === 'instructions') { /* no re-render needed for cURL */ updateCurl(); }
  if (key === 'name') { updateCurl(); }
}

function updateQuestionType(i, newType) {
  const q = questions[i];
  if (q.type === newType) return;
  q.type = newType;
  if (newType === 'choice') q.criteria = {};
  else if (newType === 'score') q.criteria = [];
  else delete q.criteria;
  renderQuestions();
}

function addQuestion() {
  questions.push({ name: 'q' + (questions.length+1), type: 'choice', instructions: '', criteria: {} });
  renderQuestions();
}

function removeQuestion(i) { questions.splice(i,1); renderQuestions(); }

function updateChoiceKey(qi, ci, value) {
  const entries = Object.entries(questions[qi].criteria);
  const oldKey = entries[ci][0];
  const newEntries = entries.map(([k,v], idx) => idx === ci ? [value, v] : [k,v]);
  questions[qi].criteria = Object.fromEntries(newEntries);
  updateCurl();
}

function updateChoiceVal(qi, ci, value) {
  const entries = Object.entries(questions[qi].criteria);
  entries[ci][1] = value;
  questions[qi].criteria = Object.fromEntries(entries);
  updateCurl();
}

function addChoiceKey(qi) {
  if (!questions[qi].criteria) questions[qi].criteria = {};
  questions[qi].criteria['new_key'] = '';
  renderQuestions();
}

function removeChoiceKey(qi, ci) {
  const entries = Object.entries(questions[qi].criteria);
  entries.splice(ci,1);
  questions[qi].criteria = Object.fromEntries(entries);
  renderQuestions();
}

function updateScoreLabel(qi, si, value) {
  questions[qi].criteria[si] = value;
  updateCurl();
}

function addScoreLabel(qi) {
  if (!questions[qi].criteria) questions[qi].criteria = [];
  questions[qi].criteria.push('');
  renderQuestions();
}

function removeScoreLabel(qi, si) {
  questions[qi].criteria.splice(si,1);
  renderQuestions();
}

// ---- Build payload ----
function buildPayload() {
  const state = document.getElementById('state').value;
  const model = document.getElementById('model').value;
  const qs = {};
  questions.forEach(q => {
    const entry = { type: q.type, instructions: q.instructions };
    if (q.type === 'choice') entry.criteria = q.criteria || {};
    if (q.type === 'score') entry.criteria = q.criteria || [];
    qs[q.name] = entry;
  });
  return JSON.stringify({ state, model, questions: qs });
}

// ---- cURL ----
function buildCurl() {
  const uri = document.getElementById('apiUri').value;
  const payload = buildPayload();
  const escaped = payload.replace(/'/g, "'\\''");
  return `curl ${uri} \\\n  -H "Content-Type: application/json" \\\n  -d '${escaped}'`;
}

function updateCurl() {
  document.getElementById('curlBox').textContent = buildCurl();
}

function copyCurl() {
  navigator.clipboard.writeText(buildCurl()).then(() => {
    const btn = document.getElementById('copyCurlBtn');
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '📋 Copy'; btn.classList.remove('copied'); }, 2000);
  });
}

// ---- Send request ----
async function sendRequest() {
  const uri = document.getElementById('apiUri').value;
  const payload = buildPayload();
  const responseArea = document.getElementById('responseArea');
  const timingEl = document.getElementById('timing');
  const timingText = document.getElementById('timingText');
  const sendBtn = document.getElementById('sendBtn');
  const spinner = document.getElementById('spinner');

  sendBtn.disabled = true;
  timingEl.style.display = 'flex';
  spinner.style.display = 'inline-block';
  timingText.textContent = 'Sending request...';
  responseArea.innerHTML = '';

  const start = performance.now();

  try {
    const res = await fetch(uri, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: payload
    });

    const elapsed = (performance.now() - start).toFixed(0);
    const status = res.status;

    if (!res.ok) {
      const text = await res.text();
      timingText.textContent = `${status} · ${elapsed}ms`;
      spinner.style.display = 'none';
      responseArea.innerHTML = `
        <div class="error-box">HTTP ${status}: ${esc(text.substring(0, 500))}</div>`;
    } else {
      const json = await res.json();
      timingText.textContent = `${status} · ${elapsed}ms`;
      spinner.style.display = 'none';
      renderResponse(json, elapsed);
    }
  } catch (err) {
    const elapsed = (performance.now() - start).toFixed(0);
    timingText.textContent = `Error · ${elapsed}ms`;
    spinner.style.display = 'none';
    responseArea.innerHTML = `<div class="error-box">${esc(err.message)}</div>`;
  }

  sendBtn.disabled = false;
}

// ---- Render response ----
function renderResponse(json, elapsed) {
  const area = document.getElementById('responseArea');

  let answersHtml = '';
  if (json.answers) {
    answersHtml = '<div class="answers-grid">';
    for (const [name, ans] of Object.entries(json.answers)) {
      answersHtml += renderAnswerCard(name, ans);
    }
    answersHtml += '</div>';
  }

  const usageHtml = json.usage ? `
    <div style="display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--text2);margin-top:16px;">
      <span>Input tokens: <strong>${json.usage.input_tokens}</strong></span>
      <span>Output tokens: <strong>${json.usage.output_tokens}</strong></span>
    </div>` : '';

  area.innerHTML = `
    <div class="card">
      <div class="response-meta">
        <div class="meta-chip"><span>Model</span> <strong>${esc(json.model||'?')}</strong></div>
        <div class="meta-chip"><span>Duration</span> <strong>${elapsed}ms</strong></div>
      </div>
      ${answersHtml}
      ${usageHtml}
    </div>`;
}

function renderAnswerCard(name, ans) {
  let valueHtml = '';
  let extras = '';

  if (ans.type === 'choice') {
    valueHtml = `<div class="answer-value choice">${esc(ans.choice)}</div>`;
    valueHtml += `<div class="answer-confidence">Confidence: ${(ans.confidence*100).toFixed(1)}% · Certainty: ${(ans.certainty*100).toFixed(1)}%</div>`;
    if (ans.probabilities) {
      extras = '<div class="prob-bars">';
      const max = Math.max(...Object.values(ans.probabilities));
      for (const [k, v] of Object.entries(ans.probabilities)) {
        const pct = (v*100).toFixed(1);
        const width = (v/max*100).toFixed(0);
        extras += `
          <div class="prob-row">
            <span class="prob-label">${esc(k)}</span>
            <div class="prob-bar-track"><div class="prob-bar-fill" style="width:${width}%"></div></div>
            <span class="prob-pct">${pct}%</span>
          </div>`;
      }
      extras += '</div>';
    }
  } else if (ans.type === 'noul') {
    const isNoul = ans.noul > 0.5;
    valueHtml = `<div class="answer-value ${isNoul?'noul-true':'noul-false'}">${isNoul ? 'YES' : 'NO'}</div>`;
    valueHtml += `<div class="answer-confidence">Score: ${ans.noul.toFixed(4)}</div>`;
  } else if (ans.type === 'score') {
    const score = ans.score.toFixed(2);
    const label = ans.legend ? ans.legend[Math.round(ans.score)] || '' : '';
    valueHtml = `<div class="answer-value score">${score}</div>`;
    if (label) valueHtml += `<div style="font-size:14px;color:var(--text2);margin-top:-2px;">≈ ${esc(label)}</div>`;
    valueHtml += `<div class="answer-confidence">Confidence: ${(ans.confidence*100).toFixed(1)}%</div>`;
    if (ans.probabilities) {
      extras = '<div class="prob-bars">';
      const max = Math.max(...Object.values(ans.probabilities));
      for (const [k, v] of Object.entries(ans.probabilities)) {
        const pct = (v*100).toFixed(1);
        const width = (v/max*100).toFixed(0);
        const lbl = ans.legend?.[k] || k;
        extras += `
          <div class="prob-row">
            <span class="prob-label">${esc(lbl)}</span>
            <div class="prob-bar-track"><div class="prob-bar-fill" style="width:${width}%"></div></div>
            <span class="prob-pct">${pct}%</span>
          </div>`;
      }
      extras += '</div>';
    }
  }

  return `
    <div class="answer-card">
      <div class="answer-type">${ans.type}</div>
      <div class="answer-name">${esc(name)}</div>
      ${valueHtml}
      ${extras}
    </div>`;
}

// ---- Init ----
document.getElementById('apiUri').addEventListener('input', updateCurl);
document.getElementById('model').addEventListener('input', updateCurl);
document.getElementById('state').addEventListener('input', updateCurl);
renderQuestions();
</script>
</body>
</html>
